
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMMART | Shop Smart</title>
<style>
:root{--blue:#123c9b;--orange:#ff8a00;--ink:#172033;--bg:#f5f7fb}
*{box-sizing:border-box}
body{margin:0;font-family:Arial;color:var(--ink);background:var(--bg)}
header{background:white;padding:16px;box-shadow:0 2px 10px #ddd}
.wrap{max-width:1100px;margin:auto;padding:16px}
.logo{font-size:28px;font-weight:bold;color:var(--blue)}
.logo span{color:var(--orange)}
button{padding:11px 16px;border:0;border-radius:8px;background:var(--blue);color:white;cursor:pointer}
input{padding:12px;border:1px solid #ddd;border-radius:8px;margin:5px}
.hero{background:linear-gradient(110deg,#123c9b,#2867cf);color:white;padding:35px;border-radius:16px;margin-top:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.card{background:white;padding:14px;border-radius:12px}
.photo{font-size:48px;text-align:center;background:#eef2fa;padding:20px}
.price{font-weight:bold;color:var(--blue)}
.panel{display:none;background:white;padding:20px;margin:20px 0;border-radius:12px}
.panel.show{display:block}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
<div class="wrap">
<div class="logo">SAM<span>MART</span></div>
<input id="search" placeholder="Search products">
<button onclick="render()">Search</button>
<button onclick="document.getElementById('admin').classList.toggle('show')">Admin</button>
</div>
</header>

<main class="wrap">
<section class="hero">
<h1>Shop Everything.<br>Shop Smart.</h1>
<p>Your everyday online shopping destination in India.</p>
</section>

<section id="admin" class="panel">
<h2>Admin Login</h2>
<input id="email" type="email" placeholder="Admin Email">
<input id="password" type="password" placeholder="Admin Password">
<button onclick="login()">Login</button>
<p id="message"></p>

<div id="dashboard" style="display:none">
<h2>Admin Dashboard</h2>
<input id="pname" placeholder="Product Name">
<input id="pcat" placeholder="Category">
<input id="pprice" type="number" placeholder="Price">
<input id="pold" type="number" placeholder="Old Price">
<input id="picon" placeholder="Emoji">
<button onclick="saveProduct()">Add Product</button>
<button onclick="logout()">Logout</button>
<div id="adminProducts"></div>
</div>
</section>

<h2>Popular Products</h2>
<div class="grid" id="products"></div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

const firebaseConfig={
apiKey:"PASTE_YOUR_API_KEY",
authDomain:"sammart-eec42.firebaseapp.com",
projectId:"sammart-eec42",
storageBucket:"sammart-eec42.firebasestorage.app",
messagingSenderId:"948224442294",
appId:"1:948224442294:web:b743ba41c79a3fdf4b4b17"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const db=getFirestore(app);

let items=[
{name:"Wireless Headphones",cat:"Electronics",price:1299,old:1999,icon:"🎧"},
{name:"Smart Watch",cat:"Electronics",price:1799,old:2499,icon:"⌚"},
{name:"Everyday Backpack",cat:"Fashion",price:899,old:1299,icon:"🎒"},
{name:"Cotton T-Shirt",cat:"Fashion",price:499,old:799,icon:"👕"},
{name:"Kitchen Storage Set",cat:"Home",price:699,old:999,icon:"🍱"},
{name:"LED Desk Lamp",cat:"Home",price:599,old:899,icon:"💡"},
{name:"Skincare Combo",cat:"Beauty",price:749,old:1099,icon:"🧴"},
{name:"Sports Water Bottle",cat:"Sports",price:299,old:449,icon:"🥤"}
];

let admin=false;

function render(){
let q=document.getElementById("search").value.toLowerCase();
let list=items.filter(p=>p.name.toLowerCase().includes(q));
document.getElementById("products").innerHTML=list.map(p=>`
<div class="card">
<div class="photo">${p.icon}</div>
<h3>${p.name}</h3>
<p class="price">₹${p.price}</p>
<button onclick="alert('Cart feature coming soon')">Add to Cart</button>
</div>`).join("");
}
window.render=render;

async function load(){
try{
let snap=await getDocs(collection(db,"products"));
if(!snap.empty)items=snap.docs.map(d=>({id:d.id,...d.data()}));
render();
showAdminProducts();
}catch(e){document.getElementById("message").textContent=e.message;}
}

window.login=async function(){
try{
await signInWithEmailAndPassword(auth,
document.getElementById("email").value,
document.getElementById("password").value);
document.getElementById("message").textContent="Login successful";
}catch(e){
document.getElementById("message").textContent=e.message;
}
};

onAuthStateChanged(auth,user=>{
admin=!!user;
document.getElementById("dashboard").style.display=admin?"block":"none";
if(admin)load();
});

window.saveProduct=async function(){
if(!admin)return;
let p={
name:document.getElementById("pname").value,
cat:document.getElementById("pcat").value,
price:Number(document.getElementById("pprice").value),
old:Number(document.getElementById("pold").value),
icon:document.getElementById("picon").value||"🛍️"
};
if(!p.name||!p.cat||!p.price){alert("Fill product details");return;}
try{
await addDoc(collection(db,"products"),p);
alert("Product added");
load();
}catch(e){alert(e.message);}
};

function showAdminProducts(){
if(!admin)return;
document.getElementById("adminProducts").innerHTML=items.filter(p=>p.id).map(p=>`
<p>${p.name} — ₹${p.price}
<button onclick="removeProduct('${p.id}')">Delete</button></p>`).join("");
}

window.removeProduct=async function(id){
if(!admin)return;
if(confirm("Delete this product?")){
await deleteDoc(doc(db,"products",id));
load();
}
};

window.logout=async function(){await signOut(auth);};
document.getElementById("search").addEventListener("input",render);
render();
load();
</script>
</body>
</html>
